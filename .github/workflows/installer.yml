name: Installer page

# Builds the WebAssembly shader tools with Emscripten and deploys the installer page (installer/) to GitHub Pages,
# together with the latest release's sf4-nx.nro and sf4.toml.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions". Then publish a release with sf4-nx.nro and sf4.toml
# attached (or run this workflow by hand after publishing one).
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'shaders/wasm/**'
      - 'shaders/me/**'
      - 'shaders/sf4_runtime_containers/**'
      - 'app/src/native/masseffect/masseffect_shader_library.*'
      - 'app/sf4.toml'
      - '.github/workflows/installer.yml'
  release:
    types: [published]     # a new release: redeploy so the page serves the new NRO
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to serve (empty: the most recent published release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: '4.0.10'
  XXHASH_REF: 'v0.8.2'
  FMT_REF: '12.1.0'

jobs:
  tools:
    name: Build hlsl / pack (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Fetch header-only dependencies
        run: |
          git clone --depth 1 --branch "$XXHASH_REF" https://github.com/Cyan4973/xxHash.git "$RUNNER_TEMP/xxHash"
          git clone --depth 1 --branch "$FMT_REF" https://github.com/fmtlib/fmt.git "$RUNNER_TEMP/fmt"
      - name: Build
        run: |
          export XXHASH_DIR="$RUNNER_TEMP/xxHash" FMT_DIR="$RUNNER_TEMP/fmt/include"
          OUT="$PWD/wasm-out" shaders/wasm/build_wasm_tools.sh hlsl pack
          ls -l wasm-out
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-tools
          path: wasm-out/
          if-no-files-found: error

  dxc:
    name: Fetch the verified DXC (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify the reference DXC compiler
        run: installer/tools/fetch_dxc.sh dxc-out
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dxc
          path: dxc-out/
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: [tools, dxc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-tools
          path: wasm-all
      - uses: actions/download-artifact@v4
        with:
          name: wasm-dxc
          path: wasm-all
      - name: Release assets (sf4-nx.nro, sf4.toml)
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-assets
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false)][0].tag_name // empty')
          fi
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern 'sf4-nx.nro' --pattern 'sf4.toml' --dir release-assets
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          else
            echo "::warning::No release published yet: the page is deployed without a build and says so."
          fi
          ls -l release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the WebAssembly tools (DXC compiles a shader)
        run: node installer/tools/wasm_smoke.mjs wasm-all
      - name: Stage the site
        run: installer/tools/stage_site.sh _site --wasm wasm-all --releases release-assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
